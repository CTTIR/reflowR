on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: minimum-R

permissions:
  contents: read

jobs:
  minimum-R:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          dependencies: '"hard"'
          # S7 1.0.0 needs R >= 4.2, so ggplot2 >= 4.0 cannot be installed on R 4.1.
          extra-packages: |
            any::testthat
            any::rcmdcheck
            ggplot2@3.5.2
          install-quarto: false
      - name: Check the declared minimum with required dependencies
        shell: Rscript {0}
        run: |
          stopifnot(getRversion() >= "4.1", getRversion() < "4.2")
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--ignore-vignettes"),
            build_args = "--no-build-vignettes",
            check_dir = "check",
            error_on = "warning"
          )
      - name: Retain minimum-R check diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimum-R-check
          path: check
          if-no-files-found: ignore
