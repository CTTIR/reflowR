on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    uses: CTTIR/.github/.github/workflows/test-coverage.yaml@main
    with:
      # Baseline macOS coverage: 89.38%; final artifact is qualified separately.
      # Linux also exercises the platform-specific worker paths.
      floor: 85
    secrets: inherit
