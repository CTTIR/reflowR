url: https://cttir.github.io/reflowR/

template:
  package: themakR

development:
  mode: auto
navbar:
  left:
    - text: "Home"
      href: index.html
    - text: "Getting started"
      href: articles/getting-started.html
    - text: "Vignettes"
      href: articles/index.html
    - text: "Functions"
      href: reference/index.html
    - text: "News"
      href: news/index.html

articles:
  - title: "Vignettes"
    desc: >
      Learn how to create themed workflowr projects with reflowR.
    contents:
      - getting-started
      - color-schemes

reference:
  - title: "Finalized-value figures"
    desc: "Render supplied values with explicit levels and no numerical reductions."
    contents:
      - reflow_figure_recipe
      - reflow_figure_plot

  - title: "Recorded imaging workflows"
    desc: "Declare package calls and execute or resume verified object workflows."
    contents:
      - reflow_imaging_stage
      - reflow_imaging_ref
      - reflow_imaging_plan
      - reflow_imaging_run
      - reflow_artifact_spec
      - reflow_artifact_run

  - title: "Project creation"
    desc: "Create and initialize themed workflowr projects."
    contents:
      - reflow_init

  - title: "Schemes and presets"
    desc: "Explore available color schemes and pipeline depth presets."
    contents:
      - reflow_scheme
      - reflow_schemes
      - reflow_preset
      - reflow_presets
      - reflow_preview

  - title: "Utilities"
    desc: "Internal helpers for icon embedding."
    contents:
      - reflow_icon_base64
